<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827">
<meta name="description" content="ماشین حساب مهندسی و ابزار تبدیل واحد رایگان فارسی">
<title>ماشین حساب</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body><main class="app">
<header><p class="eyebrow">ابزار محاسباتی رایگان</p><h1>ماشین حساب</h1><p class="subtitle" id="modeSubtitle">ماشین حساب ساده</p></header>
<div class="mode-bar"><button id="engineeringToggle" class="mode-toggle" type="button" aria-pressed="false">⚙ حالت مهندسی</button></div><nav class="tabs engineering-tabs" aria-label="بخش‌های برنامه" hidden><button class="tab active" data-tab="scientific">ماشین حساب مهندسی</button><button class="tab" data-tab="converter">تبدیل واحد</button></nav>
<section id="scientific" class="panel active simple-mode">
<div class="screen" aria-live="polite"><div id="previous" class="previous"></div><output id="display" class="display">0</output></div>
<div class="settings-row"><span>واحد زاویه</span><div class="segmented"><button id="deg" class="selected">درجه DEG</button><button id="rad">رادیان RAD</button></div></div>
<div class="keys simple-keys" aria-label="صفحه کلید ماشین حساب ساده">
<button class="utility" data-action="clear">AC</button><button class="utility" data-action="delete">⌫</button><button class="operator" data-insert="÷">÷</button><button class="operator" data-insert="×">×</button>
<button data-insert="7">۷</button><button data-insert="8">۸</button><button data-insert="9">۹</button><button class="operator" data-insert="−">−</button>
<button data-insert="4">۴</button><button data-insert="5">۵</button><button data-insert="6">۶</button><button class="operator" data-insert="+">+</button>
<button data-insert="1">۱</button><button data-insert="2">۲</button><button data-insert="3">۳</button><button class="equals" data-action="equals">=</button>
<button data-insert="0">۰</button><button data-insert=".">.</button><button data-insert="(">(</button><button data-insert=")">)</button>
</div>
<div class="keys scientific-keys">
<button class="utility" data-action="clear">AC</button><button class="utility" data-action="delete">⌫</button><button data-insert="(">(</button><button data-insert=")">)</button><button class="operator" data-insert="÷">÷</button>
<button data-insert="sin(">sin</button><button data-insert="cos(">cos</button><button data-insert="tan(">tan</button><button data-insert="√(">√</button><button class="operator" data-insert="×">×</button>
<button data-insert="asin(">sin⁻¹</button><button data-insert="acos(">cos⁻¹</button><button data-insert="atan(">tan⁻¹</button><button data-insert="ln(">ln</button><button class="operator" data-insert="−">−</button>
<button data-insert="log(">log</button><button data-insert="π">π</button><button data-insert="e">e</button><button data-insert="^">xʸ</button><button class="operator" data-insert="+">+</button>
<button data-insert="!">x!</button><button data-insert="%">%</button><button data-insert="abs(">abs</button><button data-insert="÷100">÷100</button><button data-action="equals" class="equals">=</button>
<button data-insert="7">۷</button><button data-insert="8">۸</button><button data-insert="9">۹</button><button data-insert="4">۴</button><button data-insert="5">۵</button>
<button data-insert="6">۶</button><button data-insert="1">۱</button><button data-insert="2">۲</button><button data-insert="3">۳</button><button data-insert="0">۰</button>
<button data-insert=".">.</button><button data-insert="×">×</button><button data-insert="−">−</button><button data-insert="+">+</button><button data-action="equals" class="equals">=</button>
</div><p id="message" class="message" role="status"></p><p class="hint">می‌توانی عبارت را با دکمه‌ها یا صفحه‌کلید وارد کنی. توابع مثل sin(30) به پرانتز نیاز دارند.</p>
</section>
<section id="converter" class="panel">
<h2>تبدیل واحد</h2><p class="hint">دسته‌بندی و واحد مبدأ و مقصد را انتخاب کن.</p>
<label for="category">نوع کمیت</label><select id="category">
<option value="length">طول</option><option value="mass">جرم</option><option value="temperature">دما</option><option value="area">مساحت</option><option value="volume">حجم</option><option value="time">زمان</option><option value="speed">سرعت</option><option value="data">حجم داده</option><option value="pressure">فشار</option><option value="energy">انرژی</option>
</select>
<label for="fromUnit">از واحد</label><select id="fromUnit"></select>
<label for="toUnit">به واحد</label><select id="toUnit"></select>
<label for="convertValue">مقدار</label><input id="convertValue" type="number" inputmode="decimal" value="1" step="any">
<div class="result-card"><span>نتیجه تبدیل</span><output id="convertResult">—</output><button id="swap" class="swap">جابه‌جایی واحدها ⇄</button></div>
</section>
<footer>ماشین حساب · رایگان و بدون نیاز به نصب</footer>
</main></body></html>
